<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#0b0e13;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
.page-wrap{--surface-3:#1b212b;--border-2:#2a3340;--border:#232b36;--chip-bg:rgba(148,163,184,.12);
  --text-1:#e8edf4;--text-2:#c3ccd8;--text-3:#94a3b8;--text-4:#64748b;
  width:343px;margin:20px auto;padding:16px;background:#12161d;border-radius:14px}
.card-body{padding:0}
/* 全局样式。移植自桌面版 src/index.css 的语义色变量。
   变量定义在 .page-wrap 上而不是 page 上 —— 每个页面的根节点都带这个类，
   切浅色主题时只需给它加 .theme-light，变量会被所有子元素继承。
   （变量若挂在 page 上，子元素的类名改不动 page 自身。） */

page {
  background: #12161d;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  /* .page-wrap 用的是 min-height:100%，需要一个有确定高度的父级才生效；
     内容很短的页面（例如空的待办列表）否则撑不满屏，下方会露出系统底色。
     这里不能写 100vh —— vh 把 tabBar 也算进视口高度，反而会把内容顶出屏幕。 */
  min-height: 100%;
}

.page-wrap {
  /* ── 深色主题（默认）───────────────────────────── */
  --surface-0: #12161d; /* 应用底色 */
  --surface-1: #1a1f28; /* 卡片 */
  --surface-2: #171c24; /* 卡片次档 */
  --surface-3: #1e242e; /* 内层 / 输入框底 */
  --surface-4: #262d38; /* hover 底 */
  --surface-5: #333c49; /* 更深边框 */
  --border-1: #232a34;
  --border-2: #2b333f;
  --border-3: #333c49;
  --text-1: #e2e8f0; /* 主文字 */
  --text-2: #cbd5e1; /* 正文 */
  --text-3: #94a3b8; /* 次要 */
  --text-4: #64748b; /* 弱化 */
  --hairline: rgba(255, 255, 255, 0.06);
  --chip-bg: rgba(255, 255, 255, 0.06);
  --panel-head: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0));

  /* 布局：容器自带底色。
     注意不用 min-height:100vh —— 小程序的 vh 把 tabBar 也算进视口高度，
     会导致页面底部内容被 tabBar 压住。改用 min-height:100% 让内容自然撑开，
     底部留出安全距离（padding-bottom）。 */
  min-height: 100%;
  box-sizing: border-box;
  padding: 12px 12px calc(24px + env(safe-area-inset-bottom));
  background: var(--surface-0);
  color: var(--text-1);
}

/* ── 浅色主题 ─────────────────────────────────── */
.page-wrap.theme-light {
  --surface-0: #f8fafc;
  --surface-1: #ffffff;
  --surface-2: #f8fafc;
  --surface-3: #f1f5f9;
  --surface-4: #e2e8f0;
  --surface-5: #cbd5e1;
  --border-1: #e2e8f0;
  --border-2: #cbd5e1;
  --border-3: #cbd5e1;
  --text-1: #0f172a;
  --text-2: #1e293b;
  --text-3: #475569;
  --text-4: #64748b;
  --hairline: rgba(15, 23, 42, 0.05);
  --chip-bg: rgba(15, 23, 42, 0.045);
  --panel-head: linear-gradient(180deg, rgba(15, 23, 42, 0.018), rgba(15, 23, 42, 0));
}

/* ── 布局 ─────────────────────────────────────── */
.stack > .card + .card {
  margin-top: 12px;
}

/* ── 卡片 ─────────────────────────────────────── */
/* 不用 overflow:hidden —— 卡片里常放横向滚动的统计行或下拉，
   一旦裁剪就表现为「内容被切掉」。圆角改由子元素各自处理。 */
.card {
  background: var(--surface-1);
  border-radius: 14px;
  border: 1px solid var(--border-1);
}

.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 13px 15px 10px;
  border-bottom: 1px solid var(--border-1);
  background-image: var(--panel-head);
}

.card-head-title {
  flex: 1;
  min-width: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-1);
  letter-spacing: -0.1px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 卡头右侧操作区（按钮等） */
.card-head-action {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.card-body {
  padding: 13px 15px;
}

/* 标题左侧的图标底座，用色相区分区块 */
.icon-chip {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}

.tone-emerald { background: rgba(16, 185, 129, 0.12); color: #34d399; }
.tone-sky     { background: rgba(14, 165, 233, 0.12); color: #38bdf8; }
.tone-amber   { background: rgba(245, 158, 11, 0.12); color: #fbbf24; }
.tone-rose    { background: rgba(244, 63, 94, 0.12);  color: #fb7185; }
.tone-violet  { background: rgba(139, 92, 246, 0.12); color: #a78bfa; }
.tone-slate   { background: var(--chip-bg); color: var(--text-3); }

/* ── 徽标 ─────────────────────────────────────── */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  border-radius: 499.5px;
  padding: 1.5px 7px;
  font-size: 10px;
  font-weight: 500;
  white-space: nowrap;
}

.chip-slate   { background: var(--chip-bg); color: var(--text-3); }
.chip-emerald { background: rgba(16, 185, 129, 0.15); color: #34d399; }
.chip-amber   { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
.chip-rose    { background: rgba(244, 63, 94, 0.15);  color: #fb7185; }
.chip-sky     { background: rgba(14, 165, 233, 0.15); color: #38bdf8; }
.chip-violet  { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }

/* ── 按钮 ─────────────────────────────────────── */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 38px;
  border-radius: 9px;
  background: #059669;
  color: #fff;
  font-size: 13.5px;
  font-weight: 500;
  padding: 0 15px;
  line-height: 1;
}

.btn-primary.is-disabled { opacity: 0.4; }

/* 小尺寸按钮变体 */
.btn-sm { height: 32px; font-size: 12px; padding: 0 11px; border-radius: 8px; }
.btn-xs { height: 26px; font-size: 11px; padding: 0 9px; border-radius: 7px; }

/* 按钮行：自动换行，避免窄屏挤压 */
.row-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 10px;
}

.row-actions.mt { margin-top: 12px; margin-bottom: 0; }

.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 38px;
  border-radius: 9px;
  border: 1px solid var(--border-3);
  background: var(--surface-3);
  color: var(--text-2);
  font-size: 13.5px;
  font-weight: 500;
  padding: 0 15px;
  line-height: 1;
}

/* ── 输入 ─────────────────────────────────────── */
.input {
  width: 100%;
  height: 38px;
  border-radius: 9px;
  border: 1px solid var(--border-3);
  background: var(--surface-3);
  padding: 0 11px;
  font-size: 13.5px;
  color: var(--text-1);
  box-sizing: border-box;
}

.input-ph { color: #64748b; }

/* ── 表单字段 ─────────────────────────────────── */
.field { margin-bottom: 10px; }

/* 两列并排；小程序不支持 subgrid，用 flex + min-width:0 防溢出 */
.field-row {
  display: flex;
  gap: 9px;
}

.field-row .field {
  flex: 1;
  min-width: 0;
}

.field-label {
  display: block;
  font-size: 11px;
  color: var(--text-3);
  margin-bottom: 4px;
}

.field-hint {
  font-size: 10.5px;
  color: var(--text-4);
  margin-top: 4px;
}

/* picker 的显示区，外观与 .input 一致 */
.picker {
  height: 38px;
  line-height: 38px;
  border-radius: 9px;
  border: 1px solid var(--border-3);
  background: var(--surface-3);
  padding: 0 11px;
  font-size: 13.5px;
  color: var(--text-1);
  box-sizing: border-box;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* ── 空状态 ───────────────────────────────────── */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 28px 0;
  text-align: center;
}

.empty-icon {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: var(--chip-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
}

.empty-title {
  font-size: 13.5px;
  color: var(--text-3);
  font-weight: 500;
}

.empty-desc {
  font-size: 11.5px;
  color: var(--text-4);
  line-height: 1.6;
  max-width: 230px;
}

.empty-text {
  font-size: 12px;
  color: var(--text-4);
  line-height: 1.6;
  max-width: 230px;
}

/* ── 过滤胶囊行 ───────────────────────────────── */
.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 11px;
}

.filter-pill {
  border-radius: 499.5px;
  padding: 4.5px 12px;
  font-size: 11.5px;
  font-weight: 500;
  border: 1px solid var(--border-2);
  background: var(--surface-3);
  color: var(--text-3);
}

.filter-pill.is-active {
  background: #059669;
  border-color: #059669;
  color: #fff;
}

.filter-count { margin-left: 4px; opacity: 0.75; }

/* ── 进度条 ───────────────────────────────────── */
.bar-track {
  height: 8px;
  border-radius: 499.5px;
  background: var(--surface-4);
  overflow: hidden;
  margin-top: 6px;
}

.bar-track-sm { margin-top: 0; height: 7px; }

.bar-fill {
  height: 100%;
  border-radius: 499.5px;
  background: #059669;
  transition: width 0.25s ease;
}

.bar-emerald { background: #10b981; }
.bar-amber   { background: #f59e0b; }
.bar-sky     { background: #0ea5e9; }
.bar-rose    { background: #f43f5e; }
.bar-violet  { background: #8b5cf6; }

/* ── 大数字统计 ───────────────────────────────── */
.big-stat {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 6px;
}

.big-num {
  font-size: 33px;
  font-weight: 800;
  color: var(--text-1);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.big-unit {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-4);
}

.big-side {
  font-size: 12px;
  color: var(--text-3);
}

.big-pct {
  font-size: 16px;
  font-weight: 700;
  color: #34d399;
}

.big-pct-unit { font-size: 11px; color: var(--text-4); }

/* ── 胶囊行 ───────────────────────────────────── */
.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

/* ── 说明条目 ─────────────────────────────────── */
.bullet {
  display: flex;
  gap: 6px;
  margin-bottom: 7px;
}

.bullet-dot {
  color: #10b981;
  font-size: 13px;
  line-height: 1.5;
  flex-shrink: 0;
}

.bullet-text {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.7;
}

.bullet-note {
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.8;
}

.tip-box {
  margin-top: 9px;
  border-radius: 8px;
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.28);
  padding: 9px 11px;
}

.tip-text {
  font-size: 11px;
  color: #6ee7b7;
  line-height: 1.7;
}

.inline-hint {
  font-size: 11.5px;
  color: var(--text-4);
  line-height: 1.7;
}

.tiny-note {
  font-size: 10.5px;
  color: var(--text-4);
  line-height: 1.7;
  margin-top: 7px;
}

.tiny-note.mt { margin-top: 9px; }

/* ── 通用记录列表 ─────────────────────────────── */
.log-list { margin-top: 2px; }

.log-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface-3);
  border-radius: 8px;
  padding: 9px 11px;
  margin-bottom: 6px;
}

.log-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #f59e0b;
  flex-shrink: 0;
}

.log-dot.is-primary { background: #10b981; }

.log-date {
  font-size: 11.5px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.log-type {
  flex: 1;
  min-width: 0;
  font-size: 11.5px;
  color: var(--text-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.btn-mini {
  width: 26px;
  height: 26px;
  font-size: 11px;
  border-radius: 6px;
}

/* ── 每周分布 ─────────────────────────────────── */
.week-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
}

.week-bar-label {
  width: 55px;
  flex-shrink: 0;
  font-size: 11px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

.week-bar-label.is-current {
  color: #34d399;
  font-weight: 600;
}

.week-bar-row .bar-track { flex: 1; min-width: 0; }

.week-bar-count {
  width: 40px;
  flex-shrink: 0;
  text-align: right;
  font-size: 10.5px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

/* 强调色幽灵按钮 */
.btn-ghost.btn-emerald {
  border-color: rgba(16, 185, 129, 0.4);
  color: #6ee7b7;
  background: rgba(16, 185, 129, 0.1);
}

.btn-ghost.is-disabled { opacity: 0.4; }

/* ── 指标卡网格（总览 / 体重作息共用） ─────────── */
/* 用 grid 而不是 flex-wrap + calc：小程序里 flex 的百分比宽度
   在 gap 参与计算时容易溢出或被挤压，grid 更稳。 */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 12px;
}

.stat-card {
  box-sizing: border-box;
  background: var(--surface-1);
  border: 1px solid var(--border-1);
  border-radius: 12px;
  padding: 12px 12px 11px;
  min-width: 0; /* 允许内部文字省略号生效，避免撑破格子 */
}

.stat-top {
  display: flex;
  align-items: center;
  gap: 7px;
}

.stat-label {
  flex: 1;
  font-size: 11px;
  color: var(--text-4);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.stat-value {
  display: flex;
  align-items: baseline;
  gap: 4px;
  margin-top: 8px;
}

.stat-num {
  font-size: 22px;
  font-weight: 800;
  color: var(--text-1);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.stat-unit { font-size: 11px; color: var(--text-4); }

.stat-card .chip { margin-top: 8px; }

/* ── 勾选框（多个页面共用） ───────────────────── */
.checkbox {
  width: 21px;
  height: 21px;
  border-radius: 5px;
  border: 1px solid var(--border-3);
  background: var(--surface-1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: #fff;
  flex-shrink: 0;
}

.checkbox.is-on {
  background: #059669;
  border-color: #059669;
}

/* ── 开关行（标签 + switch） ──────────────────── */
.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0 10px;
}

.switch-row:last-of-type { padding-bottom: 0; }

.switch-label {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  color: var(--text-3);
}

/* ── 信息提示条 ───────────────────────────────── */
.msg-box {
  background: rgba(14, 165, 233, 0.1);
  border: 1px solid rgba(14, 165, 233, 0.3);
  border-radius: 8px;
  padding: 9px 11px;
  font-size: 11.5px;
  color: #7dd3fc;
  line-height: 1.7;
  margin-bottom: 9px;
}

/* ── 小图标按钮（列表行内的编辑 / 删除） ──────── */
/* 之前只有 .icon-chip（比这个大一圈，带浅色底），
   行内用的 .icon-btn 一直没定义，导致 emoji 失去尺寸和间距、挤在一起。 */
.icon-btn {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  line-height: 1;
  flex-shrink: 0;
  background: var(--chip-bg);
  border: 1px solid var(--border-2);
}

/* 需要强调的（删除等）用 tone-* 上色，尺寸不变 */
.icon-btn.tone-rose {
  background: rgba(244, 63, 94, 0.14);
  border-color: rgba(244, 63, 94, 0.3);
}

.icon-btn.tone-emerald {
  background: rgba(16, 185, 129, 0.14);
  border-color: rgba(16, 185, 129, 0.3);
}

/* 更小的变体：和历史行、清单行一起用 */
.icon-btn.btn-mini {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  font-size: 11px;
}

/* ── 行内强调文字（分析 / 设置共用） ───────────── */
.hl {
  color: #34d399;
  font-weight: 600;
}
/* 体重作息页样式 */

/* ── 概览卡（复用 dashboard 的 stat-grid 结构） ── */
.stat-sub {
  font-size: 10px;
  color: var(--text-4);
  margin-top: 4px;
  line-height: 1.5;
}

.stat-num-sm {
  font-size: 19px;
  font-weight: 800;
  color: var(--text-1);
  font-variant-numeric: tabular-nums;
}

/* ── 图表 ─────────────────────────────────────── */
.chart-canvas {
  width: 100%;
  height: 140px;
}

.chart-note {
  font-size: 10.5px;
  margin-top: 6px;
  line-height: 1.6;
}

.chart-note.is-ok { color: #34d399; }
.chart-note.is-warn { color: #fbbf24; }

/* ── 训练打卡 7 格 ───────────────────────────── */
.train-grid {
  display: flex;
  gap: 5px;
}

.train-day {
  flex: 1;
  min-width: 0;
  border-radius: 8px;
  border: 1px solid var(--border-2);
  background: var(--surface-3);
  padding: 7px 0 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.train-day.is-today {
  border-color: rgba(16, 185, 129, 0.5);
}

.train-day.is-done {
  background: rgba(16, 185, 129, 0.16);
  border-color: #059669;
}

.train-wd {
  font-size: 9.5px;
  color: var(--text-4);
}

.train-num {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}

.train-mark {
  font-size: 10px;
  color: #34d399;
  line-height: 1;
}

.train-plan {
  font-size: 11px;
  color: var(--text-4);
  line-height: 1;
}

/* ── 月历打卡 ────────────────────────────────────── */
.cal {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--border);
}

.cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

/* 翻月按钮 28px 见方，手指点得中 */
.cal-nav {
  width: 28px;
  height: 28px;
  line-height: 28px;
  text-align: center;
  border-radius: 7px;
  font-size: 16px;
  color: var(--text-3);
  background: var(--chip-bg);
  flex-shrink: 0;
}

/* 已经到当月了，下个月按钮变灰（点它也没用） */
.cal-nav.is-off {
  opacity: 0.3;
}

.cal-mid { text-align: center; flex: 1; min-width: 0; }

.cal-month {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-1);
}

.cal-sub {
  margin-top: 2px;
  font-size: 10px;
  color: var(--text-4);
}

.cal-streak {
  margin-left: 6px;
  color: #34d399;
  font-weight: 600;
}

.cal-week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 4px;
}

.cal-wd {
  text-align: center;
  font-size: 10px;
  color: var(--text-4);
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.cal-cell {
  position: relative;
  height: 34px;
  border-radius: 7px;
  border: 1px solid transparent;
  background: var(--surface-3);
  color: var(--text-3);
  font-size: 11.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-variant-numeric: tabular-nums;
}

/* 邻月的日子淡出，但仍然可点 —— 方便补上个月漏打的 */
.cal-cell.is-out { opacity: 0.35; }

.cal-cell.is-future { opacity: 0.2; }

/* 有训练安排但还没打卡：浅底 + 绿边，一眼看出「该练没练」 */
.cal-cell.is-plan {
  background: rgba(16, 185, 129, 0.1);
  border-color: rgba(16, 185, 129, 0.3);
  color: #34d399;
}

.cal-cell.is-done {
  background: #10b981;
  border-color: #10b981;
  color: #fff;
  font-weight: 600;
}

.cal-cell.is-today {
  border-color: rgba(56, 189, 248, 0.6);
}

/* 勾角标：小程序不支持 :last-child 之类的伪类，直接绝对定位 */
.cal-check {
  position: absolute;
  right: 3px;
  bottom: 1px;
  font-size: 8px;
  opacity: 0.85;
}

.cal-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 9px;
  font-size: 9.5px;
  color: var(--text-4);
}

.cal-lg {
  display: flex;
  align-items: center;
  gap: 4px;
}

.cal-sw {
  width: 11px;
  height: 11px;
  border-radius: 3px;
  background: var(--surface-3);
  border: 1px solid var(--border-2);
}

.cal-sw.is-done {
  background: #10b981;
  border-color: #10b981;
}

.cal-sw.is-plan {
  background: rgba(16, 185, 129, 0.1);
  border-color: rgba(16, 185, 129, 0.3);
}

/* ── 历史行 ───────────────────────────────────── */
.hd-weight,
.hd-sleep,
.hd-steps {
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.hd-weight { color: #34d399; }
.hd-sleep { color: #38bdf8; }
.hd-steps { color: var(--text-4); }

/* ── 弹层 ─────────────────────────────────────── */
.modal-mask {
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 100;
}

.modal-card {
  width: 100%;
  max-width: 310px;
  max-height: 80%;
  overflow-y: auto;
  background: var(--surface-1);
  border: 1px solid var(--border-2);
  border-radius: 14px;
  padding: 17px 16px;
  box-sizing: border-box;
}

.modal-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-1);
  margin-bottom: 13px;
}

.phone{width:375px;background:#12161d;margin:0 auto;border-radius:18px;overflow:hidden;padding:10px 0}
